[project]
name = "project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "levit@campus.technion.ac.il" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "nbconvert[webpdf]>=7.16.6,<8",
    "numpy>=1.26.4,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2.3,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13.2,<0.14",
    "statsmodels>=0.14.4,<0.16",
    "xlrd>=2.0.1,<3",
]

[project.scripts]
project = "project:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
